<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X風投稿ジェネレーター</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #15202b;
            color: #e7e9ea;
            min-height: 100vh;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 430px;
            width: 100%;
            background-color: #000;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .screen-container {
            padding: 12px;
        }

        .input-area {
            background-color: #16181c;
            border-radius: 0;
            border-bottom: 1px solid #2f3336;
            padding: 16px;
            margin-bottom: 12px;
        }

        .user-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            flex: 1;
        }

        .input-label {
            font-size: 13px;
            color: #71767b;
            margin-bottom: 4px;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"] {
            width: 100%;
            background-color: #000;
            border: 1px solid #2f3336;
            border-radius: 4px;
            padding: 8px 12px;
            color: #e7e9ea;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="datetime-local"]:focus {
            border-color: #1d9bf0;
        }

        .stats-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .toggle-group {
            margin-bottom: 12px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #e7e9ea;
            font-size: 14px;
        }

        .toggle-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            background-color: transparent;
            border: none;
            color: #e7e9ea;
            font-size: 17px;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }

        textarea::placeholder {
            color: #71767b;
        }

        .char-count {
            text-align: right;
            color: #71767b;
            font-size: 14px;
            margin-top: 10px;
        }

        .char-count.warning {
            color: #ffd400;
        }

        .char-count.error {
            color: #f4212e;
        }

        .post-preview-wrapper {
            background-color: #000;
        }

        .post-preview {
            background-color: #000;
            border-radius: 0;
            border-bottom: 1px solid #2f3336;
            padding: 16px;
            display: none;
        }

        .post-preview.visible {
            display: block;
        }

        .post-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            padding: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1d9bf0, #7856ff);
            margin-right: 12px;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1d9bf0, #7856ff);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .user-name-row {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .display-name {
            font-weight: 700;
            font-size: 15px;
            line-height: 20px;
        }

        .username {
            color: #71767b;
            font-size: 15px;
            font-weight: 400;
            line-height: 20px;
        }

        .post-time {
            color: #71767b;
            font-size: 15px;
            font-weight: 400;
            line-height: 20px;
            margin-top: 4px;
        }

        .post-time.hidden {
            display: none;
        }

        .post-time::before {
            content: "";
            margin: 0;
        }

        .more-btn {
            margin-left: auto;
            color: #71767b;
            cursor: pointer;
            padding: 0 8px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: block;
            padding: 8px 12px;
            background-color: #000;
            border: 1px solid #2f3336;
            border-radius: 4px;
            color: #e7e9ea;
            cursor: pointer;
            text-align: center;
            font-size: 15px;
        }

        .file-input-label:hover {
            border-color: #1d9bf0;
        }

        input[type="file"] {
            display: none;
        }

        .avatar-preview {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 8px;
        }

        .post-content {
            font-size: 15px;
            line-height: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 12px 0 12px 0;
            color: #e7e9ea;
        }

        .post-image-container {
            margin: 12px 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #2f3336;
        }

        .post-image-grid {
            display: grid;
            gap: 2px;
            background-color: #2f3336;
            width: 100%;
        }

        .post-image-grid.layout-1 {
            grid-template-columns: 1fr;
        }

        .post-image-grid.layout-2 {
            grid-template-columns: 1fr 1fr;
        }

        .post-image-grid.layout-3 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .post-image-grid.layout-3 .post-image-item:first-child {
            grid-row: 1 / span 2;
        }

        .post-image-grid.layout-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        .post-image-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #000;
        }

        .post-image-grid.layout-2 .post-image-item,
        .post-image-grid.layout-3 .post-image-item,
        .post-image-grid.layout-4 .post-image-item {
            aspect-ratio: auto;
            height: 100%;
        }

        .post-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .post-image-item.exporting {
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .post-image-grid.layout-1 .post-image-item {
            aspect-ratio: 16 / 9;
        }

        .post-image-grid.aspect-rect {
            aspect-ratio: 16 / 9;
        }

        .post-image-grid.aspect-square {
            aspect-ratio: 1 / 1;
        }

        .post-image-grid.layout-2 .post-image-item:first-child {
            border-top-left-radius: 14px;
            border-bottom-left-radius: 14px;
        }

        .post-image-grid.layout-2 .post-image-item:last-child {
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
        }

        .post-image-grid.layout-3 .post-image-item:first-child {
            border-top-left-radius: 14px;
            border-bottom-left-radius: 14px;
        }

        .post-image-grid.layout-3 .post-image-item:nth-child(2) {
            border-top-right-radius: 14px;
        }

        .post-image-grid.layout-3 .post-image-item:nth-child(3) {
            border-bottom-right-radius: 14px;
        }

        .post-image-grid.layout-4 .post-image-item:first-child {
            border-top-left-radius: 14px;
        }

        .post-image-grid.layout-4 .post-image-item:nth-child(2) {
            border-top-right-radius: 14px;
        }

        .post-image-grid.layout-4 .post-image-item:nth-child(3) {
            border-bottom-left-radius: 14px;
        }

        .post-image-grid.layout-4 .post-image-item:nth-child(4) {
            border-bottom-right-radius: 14px;
        }

        .post-image-grid.aspect-rect.layout-2 {
            grid-template-columns: 1fr 1fr;
        }

        .post-image-grid.aspect-rect.layout-3 {
            grid-template-columns: 1fr 1fr;
        }

        .post-image-grid.aspect-rect.layout-4 {
            grid-template-columns: 1fr 1fr;
        }

        .image-preview-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .image-preview-item {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2f3336;
            background-color: #000;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 9999px;
            border: none;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 14px;
            line-height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-remove-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .post-image-label {
            display: block;
            padding: 12px;
            background-color: #16181c;
            border: 2px dashed #2f3336;
            border-radius: 16px;
            color: #1d9bf0;
            cursor: pointer;
            text-align: center;
            font-size: 15px;
            margin: 12px 0;
        }

        .post-image-label:hover {
            background-color: #1c1f23;
        }

        .reply-image-label {
            display: block;
            padding: 8px 12px;
            background-color: #000;
            border: 1px solid #2f3336;
            border-radius: 8px;
            color: #e7e9ea;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        .reply-image-label:hover {
            border-color: #1d9bf0;
        }

        input[type="file"]#postImageInput {
            display: none;
        }

        .post-meta {
            color: #71767b;
            font-size: 15px;
            padding: 0;
            margin: 16px 0 4px 0;
            line-height: 20px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0;
        }

        .meta-sep {
            margin: 0 4px;
        }

        .post-meta.hidden {
            display: none;
        }

        #previewViewCountText {
            color: #e7e9ea;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            margin: 12px 0 0 0;
            max-width: 425px;
            border-top: 1px solid #2f3336;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #71767b;
            font-size: 13px;
            cursor: pointer;
            padding: 8px 0;
            transition: color 0.2s;
        }

        .action-item:hover {
            color: #1d9bf0;
        }

        .action-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon svg {
            width: 18.75px;
            height: 18.75px;
        }

        .action-count {
            font-size: 13px;
            font-weight: 400;
            line-height: 16px;
        }

        .download-btn {
            background-color: #1d9bf0;
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: #1a8cd8;
        }

        .download-btn:disabled {
            background-color: #2f3336;
            color: #71767b;
            cursor: not-allowed;
        }

        .theme-toggle {
            display: flex;
            justify-content: flex-end;
            padding: 12px 16px;
            border-bottom: 1px solid #2f3336;
        }

        .theme-toggle-btn {
            background-color: transparent;
            border: 1px solid #2f3336;
            border-radius: 9999px;
            padding: 8px 16px;
            color: #1d9bf0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            background-color: rgba(29, 155, 240, 0.1);
        }

        /* Light mode styles */
        body.light-mode {
            background-color: #f7f9f9;
            color: #0f1419;
        }

        body.light-mode .container {
            background-color: #ffffff;
        }

        body.light-mode .input-area {
            background-color: #ffffff;
            border-bottom: 1px solid #eff3f4;
        }

        body.light-mode .post-preview {
            background-color: #ffffff;
            border-bottom: 1px solid #eff3f4;
        }

        body.light-mode .post-preview-wrapper {
            background-color: #ffffff;
        }

        body.light-mode .theme-toggle {
            border-bottom: 1px solid #eff3f4;
        }

        body.light-mode .theme-toggle-btn {
            border-color: #cfd9de;
            color: #1d9bf0;
        }

        body.light-mode input[type="text"],
        body.light-mode input[type="number"],
        body.light-mode input[type="datetime-local"] {
            background-color: #ffffff;
            border-color: #cfd9de;
            color: #0f1419;
        }

        body.light-mode input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: none;
        }

        body.light-mode textarea {
            color: #0f1419;
        }

        body.light-mode textarea::placeholder {
            color: #536471;
        }

        body.light-mode .input-label {
            color: #536471;
        }

        body.light-mode .char-count {
            color: #536471;
        }

        body.light-mode .toggle-label {
            color: #0f1419;
        }

        body.light-mode .file-input-label {
            background-color: #ffffff;
            border-color: #cfd9de;
            color: #0f1419;
        }

        body.light-mode .post-image-label {
            background-color: #f7f9f9;
            border-color: #cfd9de;
        }

        body.light-mode .post-image-label:hover {
            background-color: #eff3f4;
        }

        body.light-mode .reply-image-label {
            background-color: #ffffff;
            border-color: #cfd9de;
            color: #0f1419;
        }

        body.light-mode .display-name,
        body.light-mode .post-content {
            color: #0f1419;
        }

        body.light-mode .username,
        body.light-mode .post-time,
        body.light-mode .post-meta,
        body.light-mode .action-item {
            color: #536471;
        }

        body.light-mode #previewViewCountText {
            color: #0f1419;
        }

        body.light-mode .more-btn {
            color: #536471;
        }

        body.light-mode .post-actions {
            border-top: 1px solid #eff3f4;
        }

        body.light-mode .post-image-container {
            border-color: #cfd9de;
        }

        body.light-mode select {
            background-color: #ffffff;
            border-color: #cfd9de;
            color: #0f1419;
        }

        /* Reply styles */
        .replies-container {
            border-top: 1px solid #2f3336;
            background-color: #000;
        }

        .replies-header {
            padding: 10px 16px 6px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #e7e9ea;
        }

        .reply-item {
            position: relative;
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            padding-left: calc(16px + (var(--nest-level, 0) * 24px));
            border-bottom: 1px solid #2f3336;
        }

        .reply-item.nested {
            padding-left: calc(16px + (var(--nest-level, 1) * 24px));
        }

        .reply-item.nested::before {
            content: '';
            position: absolute;
            left: calc(28px + ((var(--nest-level, 1) - 1) * 24px));
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #2f3336;
        }

        .reply-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7856ff, #1d9bf0);
            flex-shrink: 0;
            overflow: hidden;
        }

        .reply-body {
            flex: 1;
            min-width: 0;
        }

        .reply-user-name {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .reply-display-name {
            font-weight: 700;
            font-size: 15px;
            color: #e7e9ea;
        }

        .reply-username,
        .reply-time {
            color: #71767b;
            font-size: 14px;
        }

        .reply-meta-line {
            color: #71767b;
            font-size: 13px;
            margin-top: 2px;
        }

        .reply-meta-line span {
            color: #1d9bf0;
        }

        .reply-content {
            font-size: 15px;
            line-height: 20px;
            color: #e7e9ea;
            margin: 6px 0 8px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .reply-media {
            margin: 8px 0 6px 0;
        }

        .reply-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #71767b;
            font-size: 13px;
        }

        .reply-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: inherit;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 0;
            transition: color 0.2s;
        }

        .reply-action-btn:hover {
            color: #1d9bf0;
        }

        .reply-action-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reply-action-icon svg {
            width: 16px;
            height: 16px;
        }

        .reply-action-count {
            font-size: 12px;
            line-height: 16px;
        }

        .reply-action-count:empty {
            display: none;
        }

        .add-reply-section {
            background-color: #16181c;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #2f3336;
        }

        .reply-form {
            margin-top: 12px;
            padding: 12px;
            background-color: #000;
            border-radius: 8px;
            border: 1px solid #2f3336;
            display: none;
        }

        .reply-form.active {
            display: block;
        }

        .reply-form-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .reply-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .reply-form textarea {
            width: 100%;
            min-height: 60px;
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 4px;
            padding: 8px 12px;
            color: #e7e9ea;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
        }

        .reply-form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .reply-form-btn {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .reply-form-btn.primary {
            background-color: #1d9bf0;
            color: white;
        }

        .reply-form-btn.primary:hover {
            background-color: #1a8cd8;
        }

        .reply-form-btn.secondary {
            background-color: transparent;
            color: #e7e9ea;
            border: 1px solid #2f3336;
        }

        .reply-form-btn.secondary:hover {
            background-color: #16181c;
        }

        .delete-reply-btn {
            color: #f4212e;
            margin-left: 8px;
        }

        .delete-reply-btn:hover {
            color: #ff5f6b;
        }

        /* Light mode reply styles */
        body.light-mode .replies-container {
            border-top: 1px solid #eff3f4;
            background-color: #ffffff;
        }

        body.light-mode .reply-item {
            border-bottom: 1px solid #eff3f4;
        }

        body.light-mode .reply-item.nested::before {
            background-color: #cfd9de;
        }

        body.light-mode .reply-display-name,
        body.light-mode .reply-content,
        body.light-mode .replies-header {
            color: #0f1419;
        }

        body.light-mode .reply-username,
        body.light-mode .reply-time,
        body.light-mode .reply-meta-line,
        body.light-mode .reply-action-btn {
            color: #536471;
        }

        body.light-mode .add-reply-section {
            background-color: #f7f9f9;
            border-color: #cfd9de;
        }

        body.light-mode .reply-form {
            background-color: #ffffff;
            border-color: #cfd9de;
        }

        body.light-mode .reply-form textarea {
            background-color: #ffffff;
            border-color: #cfd9de;
            color: #0f1419;
        }

        body.light-mode .reply-form-btn.secondary {
            color: #0f1419;
            border-color: #cfd9de;
        }

        body.light-mode .reply-form-btn.secondary:hover {
            background-color: #f7f9f9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="screen-container">
            <div class="theme-toggle">
                <button class="theme-toggle-btn" id="themeToggle">
                    <span id="themeIcon">☀️</span>
                    <span id="themeText">ライトモード</span>
                </button>
            </div>
            <div class="input-area">
                <div class="user-inputs">

    <script src="https://cdn.jsdelivr.net/npm/dom-to-image-more@3.4.5/dist/dom-to-image-more.min.js"></script>
    <script>
        const postInput = document.getElementById('postInput');
        const charCount = document.getElementById('charCount');
        const postPreview = document.getElementById('postPreview');
        const previewContent = document.getElementById('previewContent');
        const downloadBtn = document.getElementById('downloadBtn');
        const displayNameInput = document.getElementById('displayName');
        const usernameInput = document.getElementById('username');
        const postDateTimeInput = document.getElementById('postDateTime');
        const avatarInput = document.getElementById('avatarInput');
        const postImageInput = document.getElementById('postImageInput');
        const postImagePreviewList = document.getElementById('postImagePreviewList');
        const multiImageAspect = document.getElementById('multiImageAspect');
        const previewDisplayName = document.getElementById('previewDisplayName');
        const previewUsername = document.getElementById('previewUsername');
        const previewPostTime = document.getElementById('previewPostTime');
        const avatarPreview = document.getElementById('avatarPreview');
        const postImageContainer = document.getElementById('postImageContainer');
        const postPreviewWrapper = document.getElementById('postPreviewWrapper');
        const replyCountInput = document.getElementById('replyCount');
        const repostCountInput = document.getElementById('repostCount');
        const likeCountInput = document.getElementById('likeCount');
        const bookmarkCountInput = document.getElementById('bookmarkCount');
        const viewCountInput = document.getElementById('viewCount');
        const actionReplyCount = document.getElementById('actionReplyCount');
        const actionRepostCount = document.getElementById('actionRepostCount');
        const actionLikeCount = document.getElementById('actionLikeCount');
        const actionViewCount = document.getElementById('actionViewCount');
        const showMetaToggle = document.getElementById('showMetaToggle');
        const showTimeToggle = document.getElementById('showTimeToggle');
        const postMeta = document.querySelector('.post-meta');
        const postTime = document.getElementById('previewPostTime');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const repliesContainer = document.getElementById('repliesContainer');
        const repliesDisplay = document.getElementById('repliesDisplay');
        const addReplyBtn = document.getElementById('addReplyBtn');
        const mainReplyForm = document.getElementById('mainReplyForm');
        const cancelReplyBtn = document.getElementById('cancelReplyBtn');
        const submitReplyBtn = document.getElementById('submitReplyBtn');
        const replyDisplayName = document.getElementById('replyDisplayName');
        const replyUsername = document.getElementById('replyUsername');
        const replyContent = document.getElementById('replyContent');
        const replyTime = document.getElementById('replyTime');
        const replyParentSelect = document.getElementById('replyParentSelect');
        const replyImageInput = document.getElementById('replyImageInput');
        const replyImagePreviewList = document.getElementById('replyImagePreviewList');

        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text ?? '';
            return div.innerHTML;
        }

        function getTimeAgo(dateTime) {
            if (!dateTime) return '1時間';

            const postDate = new Date(dateTime);
            const now = new Date();
            const diffMs = now - postDate;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return '今';
            if (diffMins < 60) return `${diffMins}分`;
            if (diffHours < 24) return `${diffHours}時間`;
            if (diffDays < 7) return `${diffDays}日`;

            const m = postDate.getMonth() + 1;
            const d = postDate.getDate();
            return `${m}月${d}日`;
        }

        function formatDateTime(dateTime) {
            if (!dateTime) return '午後11:30 · 2025年10月22日';

            const date = new Date(dateTime);
            const hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? '午後' : '午前';
            const displayHours = hours % 12 || 12;

            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();

            return `${ampm}${displayHours}:${minutes} · ${year}年${month}月${day}日`;
        }

        function ensurePreviewVisible() {
            postPreview.classList.add('visible');
            downloadBtn.disabled = false;
        }

        function updateDateTime() {
            const preview = document.getElementById('postPreview');
            if (!preview) return;

            const postTimeEl = preview.querySelector('#previewPostTime');
            if (postTimeEl) {
                postTimeEl.textContent = getTimeAgo(postDateTimeInput.value);
            }

            const count = parseInt(viewCountInput.value, 10) || 0;
            const formatted = formatNumber(count);

            const metaContainer = preview.querySelector('.post-meta');
            if (!metaContainer) {
                ensurePreviewVisible();
                return;
            }

            let metaText = metaContainer.querySelector('#previewPostMetaText');
            let viewText = metaContainer.querySelector('#previewViewCountText');

            if (!metaText || !viewText) {
                metaContainer.innerHTML = `
                    <span id="previewPostMetaText"></span>
                    <span class="meta-sep"> · </span>
                    <span style="font-weight: bold;" id="previewViewCountText"></span>
                    <span class="meta-suffix"> 件の表示</span>
                `;
                metaText = metaContainer.querySelector('#previewPostMetaText');
                viewText = metaContainer.querySelector('#previewViewCountText');
            }

            if (metaText) metaText.textContent = formatDateTime(postDateTimeInput.value);
            if (viewText) viewText.textContent = formatted;
            ensurePreviewVisible();
        }

        function syncStatsFromInputs() {
            const replies = parseInt(replyCountInput.value, 10) || 0;
            const reposts = parseInt(repostCountInput.value, 10) || 0;
            const likes = parseInt(likeCountInput.value, 10) || 0;
            const views = parseInt(viewCountInput.value, 10) || 0;

            actionReplyCount.textContent = formatNumber(replies);
            actionRepostCount.textContent = formatNumber(reposts);
            actionLikeCount.textContent = formatNumber(likes);
            actionViewCount.textContent = formatNumber(views);
            updateDateTime();
            ensurePreviewVisible();
        }

        function randomBetween(min, max) {
            const low = Math.min(min, max);
            const high = Math.max(min, max);
            return Math.floor(Math.random() * (high - low + 1)) + low;
        }

        function randomFloat(min, max) {
            return Math.random() * (max - min) + min;
        }

        // デフォルト値を設定（スクリプトはbody末尾なのでDOM構築済み）
        if (!postDateTimeInput.value) {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            postDateTimeInput.value = now.toISOString().slice(0, 16);
        }

        // 初期表示を更新
        updateDateTime();
        syncStatsFromInputs();

        postInput.addEventListener('input', function () {
            const length = this.value.length;
            charCount.textContent = `${length} / 280`;

            // 文字数に応じて色を変更
            charCount.classList.remove('warning', 'error');
            if (length > 260) {
                charCount.classList.add('error');
            } else if (length > 240) {
                charCount.classList.add('warning');
            }

            // プレビュー表示
            if (length > 0) {
                previewContent.textContent = this.value;
                postPreview.classList.add('visible');
                downloadBtn.disabled = false;
            } else {
                postPreview.classList.remove('visible');
                downloadBtn.disabled = true;
            }
        });

        displayNameInput.addEventListener('input', function () {
            previewDisplayName.textContent = this.value || 'ユーザー名';
        });

        usernameInput.addEventListener('input', function () {
            const username = this.value.replace(/^@/, '');
            previewUsername.textContent = '@' + (username || 'username');
        });

        postDateTimeInput.addEventListener('input', function () {
            updateDateTime();
        });

        postDateTimeInput.addEventListener('change', function () {
            updateDateTime();
        });

        postDateTimeInput.addEventListener('blur', function () {
            updateDateTime();
        });



        // keep updates event-driven for clarity

        avatarInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    avatarPreview.innerHTML = `<img src="${event.target.result}" alt="Avatar">`;
                };
                reader.readAsDataURL(file);
            }
        });

        let postImageDataUrls = [];

        function renderPostImages() {
            if (postImageDataUrls.length === 0) {
                postImageContainer.innerHTML = '';
                postImageContainer.style.display = 'none';

        // ===== Crop Modal Logic =====
        function showCropModal(sourceCanvas, bgColor) {
            const modal = document.getElementById('cropModal');
            const container = document.getElementById('cropContainer');
            const cropCanvasEl = document.getElementById('cropCanvas');
            const overlayTop = document.getElementById('cropOverlayTop');
            const overlayBottom = document.getElementById('cropOverlayBottom');
            const overlayLeft = document.getElementById('cropOverlayLeft');
            const overlayRight = document.getElementById('cropOverlayRight');
            const cropFrame = document.getElementById('cropFrame');
            const zoomSlider = document.getElementById('cropZoomSlider');

            // Scale source to fit display
            const maxDisplayW = Math.min(420, window.innerWidth * 0.88);
            const maxDisplayH = window.innerHeight * 0.6;
            const fitScale = Math.min(maxDisplayW / sourceCanvas.width, maxDisplayH / sourceCanvas.height);
            const displayW = Math.round(sourceCanvas.width * fitScale);
            const displayH = Math.round(sourceCanvas.height * fitScale);

            cropCanvasEl.width = displayW;
            cropCanvasEl.height = displayH;
            const ctx = cropCanvasEl.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(sourceCanvas, 0, 0, displayW, displayH);

            container.style.width = displayW + 'px';
            container.style.height = displayH + 'px';

            // Crop state: size and position (in display px)
            const minCropSize = Math.min(displayW, displayH) * 0.2;
            const maxCropSize = Math.min(displayW, displayH);
            let cropSize = maxCropSize; // start at 100%
            let cropX = Math.round((displayW - cropSize) / 2);
            let cropY = Math.round((displayH - cropSize) / 2);

            // Slider range maps to crop size
            zoomSlider.value = 100;

            function clampPosition() {
                cropX = Math.max(0, Math.min(displayW - cropSize, cropX));
                cropY = Math.max(0, Math.min(displayH - cropSize, cropY));
            }

            function updateOverlays() {
                clampPosition();
                // Top
                overlayTop.style.left = '0';
                overlayTop.style.right = '0';
                overlayTop.style.top = '0';
                overlayTop.style.height = cropY + 'px';
                // Bottom
                overlayBottom.style.left = '0';
                overlayBottom.style.right = '0';
                overlayBottom.style.top = (cropY + cropSize) + 'px';
                overlayBottom.style.bottom = '0';
                overlayBottom.style.height = Math.max(0, displayH - cropY - cropSize) + 'px';
                // Left
                overlayLeft.style.top = cropY + 'px';
                overlayLeft.style.left = '0';
                overlayLeft.style.width = cropX + 'px';
                overlayLeft.style.height = cropSize + 'px';
                // Right
                overlayRight.style.top = cropY + 'px';
                overlayRight.style.right = '0';
                overlayRight.style.width = Math.max(0, displayW - cropX - cropSize) + 'px';
                overlayRight.style.height = cropSize + 'px';
                // Frame
                cropFrame.style.left = cropX + 'px';
                cropFrame.style.top = cropY + 'px';
                cropFrame.style.width = cropSize + 'px';
                cropFrame.style.height = cropSize + 'px';
            }
            updateOverlays();
            modal.style.display = 'flex';

            // Zoom slider
            zoomSlider.oninput = function () {
                const pct = parseInt(this.value) / 100;
                const newSize = Math.round(minCropSize + (maxCropSize - minCropSize) * pct);
                const centerX = cropX + cropSize / 2;
                const centerY = cropY + cropSize / 2;
                cropSize = newSize;
                cropX = Math.round(centerX - cropSize / 2);
                cropY = Math.round(centerY - cropSize / 2);
                updateOverlays();
            };

            // Mouse wheel zoom
            function onWheel(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -5 : 5;
                const newVal = Math.max(20, Math.min(100, parseInt(zoomSlider.value) + delta));
                zoomSlider.value = newVal;
                zoomSlider.oninput.call(zoomSlider);
            }
            container.addEventListener('wheel', onWheel, { passive: false });

            // Drag handling (2D)
            let dragging = false;
            let dragStartX = 0, dragStartY = 0;
            let dragStartCropX = 0, dragStartCropY = 0;

            function getClientPos(e) {
                if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            // Corner resize state
            let resizing = false;
            let resizeHandle = null;
            let resizeStartX = 0, resizeStartY = 0;
            let resizeStartCropX = 0, resizeStartCropY = 0, resizeStartCropSize = 0;

            function onHandleDown(e) {
                e.stopPropagation();
                e.preventDefault();
                const handle = e.target.closest('.crop-handle');
                if (!handle) return;
                resizing = true;
                resizeHandle = handle.dataset.handle;
                const pos = getClientPos(e);
                resizeStartX = pos.x;
                resizeStartY = pos.y;
                resizeStartCropX = cropX;
                resizeStartCropY = cropY;
                resizeStartCropSize = cropSize;
            }

            function onHandleMove(e) {
                if (!resizing) return;
                e.preventDefault();
                const pos = getClientPos(e);
                const dx = pos.x - resizeStartX;
                const dy = pos.y - resizeStartY;

                // Use the larger absolute delta to determine resize amount, keeping square
                let delta;
                switch (resizeHandle) {
                    case 'br':
                        delta = Math.max(dx, dy);
                        cropSize = Math.max(minCropSize, Math.min(maxCropSize, resizeStartCropSize + delta));
                        cropX = resizeStartCropX;
                        cropY = resizeStartCropY;
                        break;
                    case 'bl':
                        delta = Math.max(-dx, dy);
                        cropSize = Math.max(minCropSize, Math.min(maxCropSize, resizeStartCropSize + delta));
                        cropX = resizeStartCropX - (cropSize - resizeStartCropSize);
                        cropY = resizeStartCropY;
                        break;
                    case 'tr':
                        delta = Math.max(dx, -dy);
                        cropSize = Math.max(minCropSize, Math.min(maxCropSize, resizeStartCropSize + delta));
                        cropX = resizeStartCropX;
                        cropY = resizeStartCropY - (cropSize - resizeStartCropSize);
                        break;
                    case 'tl':
                        delta = Math.max(-dx, -dy);
                        cropSize = Math.max(minCropSize, Math.min(maxCropSize, resizeStartCropSize + delta));
                        cropX = resizeStartCropX - (cropSize - resizeStartCropSize);
                        cropY = resizeStartCropY - (cropSize - resizeStartCropSize);
                        break;
                }
                // Sync slider
                zoomSlider.value = Math.round(((cropSize - minCropSize) / (maxCropSize - minCropSize)) * 100);
                updateOverlays();
            }

            function onHandleUp() {
                resizing = false;
                resizeHandle = null;
            }

            // Attach corner handle events
            const handles = cropFrame.querySelectorAll('.crop-handle');
            handles.forEach(h => {
                h.addEventListener('mousedown', onHandleDown);
                h.addEventListener('touchstart', onHandleDown, { passive: false });
            });
            window.addEventListener('mousemove', onHandleMove);
            window.addEventListener('touchmove', onHandleMove, { passive: false });
            window.addEventListener('mouseup', onHandleUp);
            window.addEventListener('touchend', onHandleUp);

            function onPointerDown(e) {
                if (resizing) return;
                dragging = true;
                const pos = getClientPos(e);
                dragStartX = pos.x;
                dragStartY = pos.y;
                dragStartCropX = cropX;
                dragStartCropY = cropY;
                container.style.cursor = 'grabbing';
                e.preventDefault();
            }
            function onPointerMove(e) {
                if (!dragging || resizing) return;
                const pos = getClientPos(e);
                cropX = dragStartCropX + (pos.x - dragStartX);
                cropY = dragStartCropY + (pos.y - dragStartY);
                updateOverlays();
                e.preventDefault();
            }
            function onPointerUp() {
                dragging = false;
                container.style.cursor = 'grab';
            }

            container.addEventListener('mousedown', onPointerDown);
            container.addEventListener('touchstart', onPointerDown, { passive: false });
            window.addEventListener('mousemove', onPointerMove);
            window.addEventListener('touchmove', onPointerMove, { passive: false });
            window.addEventListener('mouseup', onPointerUp);
            window.addEventListener('touchend', onPointerUp);

            function cleanup() {
                container.removeEventListener('mousedown', onPointerDown);
                container.removeEventListener('touchstart', onPointerDown);
                container.removeEventListener('wheel', onWheel);
                window.removeEventListener('mousemove', onPointerMove);
                window.removeEventListener('touchmove', onPointerMove);
                window.removeEventListener('mouseup', onPointerUp);
                window.removeEventListener('touchend', onPointerUp);
                // Cleanup corner handle events
                handles.forEach(h => {
                    h.removeEventListener('mousedown', onHandleDown);
                    h.removeEventListener('touchstart', onHandleDown);
                });
                window.removeEventListener('mousemove', onHandleMove);
                window.removeEventListener('touchmove', onHandleMove);
                window.removeEventListener('mouseup', onHandleUp);
                window.removeEventListener('touchend', onHandleUp);
                zoomSlider.oninput = null;
                modal.style.display = 'none';
            }

            document.getElementById('cropCancel').onclick = cleanup;

            document.getElementById('cropConfirm').onclick = function () {
                // Map display coords back to source canvas coords
                const srcScale = sourceCanvas.width / displayW;
                const sx = Math.round(cropX * srcScale);
                const sy = Math.round(cropY * srcScale);
                const sSize = Math.round(cropSize * srcScale);

                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = 1080;
                finalCanvas.height = 1080;
                const fctx = finalCanvas.getContext('2d');
                fctx.imageSmoothingEnabled = true;
                fctx.imageSmoothingQuality = 'high';

                fctx.fillStyle = bgColor;
                fctx.fillRect(0, 0, 1080, 1080);

                // Clamp to source bounds
                const drawW = Math.min(sSize, sourceCanvas.width - sx);
                const drawH = Math.min(sSize, sourceCanvas.height - sy);
                const destW = Math.round(drawW * (1080 / sSize));
                const destH = Math.round(drawH * (1080 / sSize));
                const destX = drawW < sSize ? Math.round((1080 - destW) / 2) : 0;
                const destY = drawH < sSize ? Math.round((1080 - destH) / 2) : 0;

                fctx.drawImage(
                    sourceCanvas,
                    sx, sy, drawW, drawH,
                    destX, destY, destW, destH
                );

                const link = document.createElement('a');
                link.download = 'x-post-1080.png';
                link.href = finalCanvas.toDataURL('image/png');
                link.click();

                cleanup();
            };
        }

        // テーマ切り替え機能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        // ローカルストレージからテーマを読み込む
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeIcon.textContent = '🌙';
            themeText.textContent = 'ダークモード';
        }

        themeToggle.addEventListener('click', function () {
            document.body.classList.toggle('light-mode');

            if (document.body.classList.contains('light-mode')) {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'ダークモード';
                localStorage.setItem('theme', 'light');
            } else {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'ライトモード';
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
</body>

</html>
